      }

      function renderCartSummaryFooter(totals) {
        const itemsLabel = totals.totalUnits === 1 ? '1 ítem' : `${totals.totalUnits} ítems`;
        const isMixed = paymentMode === 'mixto';
        const isCash = paymentMode === 'efectivo';

        if (isMixed) {
          els.cartTotalLabel.textContent = `Total Mixto (${getMixedRuleLabel(mixedPriceRule)})`;
          els.cartTotalAmount.textContent = formatARS(totals.activeTotal);
          els.cartTotalAmount.className = 'total-amount tabular is-mixed';
          els.altTotalBtn.style.display = 'none';

          if (cart.length > 0) {
            els.mixedPanel.style.display = 'flex';
            if (document.activeElement !== els.mixedCashInput) {
              els.mixedCashInput.value = (mixedAnchor === 'cash' && mixedRawInput !== '') ? mixedRawInput : String(totals.mixed.cashPart);
            }
            if (document.activeElement !== els.mixedTransferInput) {
              els.mixedTransferInput.value = (mixedAnchor === 'transfer' && mixedRawInput !== '') ? mixedRawInput : String(totals.mixed.transferPart);
            }

            if (totals.mixed.overflowed) {
              els.mixedHint.textContent = `El monto ingresado cubre o supera el total (${formatARS(totals.activeTotal)}).`;
            } else if (mixedPriceRule === 'proporcional') {
              els.mixedHint.textContent = `Proporcional: pagando ${formatARS(totals.mixed.cashPart)} en efectivo, faltan ${formatARS(totals.mixed.transferPart)} por transferencia.`;
            } else {
              const baseName = mixedPriceRule === 'efectivo' ? 'Efectivo' : 'Transferencia';
              els.mixedHint.textContent = `Mantiene total ${baseName} (${formatARS(totals.activeTotal)}). Podés editar cualquiera de las dos partes.`;
            }

            els.changeRow.style.display = 'flex';
            els.changeLabel.textContent = 'Paga efec. con $';
            updateChangeDisplay(totals.mixed.cashPart);
          } else {
            els.mixedPanel.style.display = 'none';
            els.changeRow.style.display = 'none';
          }
        } else {
          els.mixedPanel.style.display = 'none';
          els.cartTotalLabel.textContent = isCash ? 'Total Efectivo' : 'Total Transferencia';
          els.cartTotalAmount.textContent = formatARS(totals.activeTotal);
          els.cartTotalAmount.className = `total-amount tabular ${isCash ? 'is-cash' : 'is-transfer'}`;

          if (cart.length > 0) {
            els.altTotalBtn.style.display = 'flex';
            els.altTotalText.textContent = isCash
              ? `En transferencia: ${formatARS(totals.altTotal)}`
              : `En efectivo: ${formatARS(totals.altTotal)}`;
          } else {
            els.altTotalBtn.style.display = 'none';
          }

          if (isCash && cart.length > 0) {
            els.changeRow.style.display = 'flex';
            els.changeLabel.textContent = 'Paga con $';
            updateChangeDisplay(totals.totalCash);
          } else {
            els.changeRow.style.display = 'none';
          }
        }

        els.mobileBarCount.textContent = itemsLabel;
        if (isMixed) {
          els.mobileBarMode.textContent = 'Mixto';
          els.mobileBarAlt.textContent = cart.length > 0
            ? `· Ef: ${formatARS(totals.mixed.cashPart)} + Tr: ${formatARS(totals.mixed.transferPart)}`
            : '';
          els.mobileBarTotal.className = 'mobile-bar-total tabular is-mixed';
        } else {
          els.mobileBarMode.textContent = isCash ? 'Efectivo' : 'Transf.';
          els.mobileBarAlt.textContent = cart.length > 0
            ? `· ${isCash ? 'Transf' : 'Efec'}: ${formatARS(totals.altTotal)}`
            : '';
          els.mobileBarTotal.className = `mobile-bar-total tabular ${isCash ? 'is-cash' : 'is-transfer'}`;
        }
        els.mobileBarTotal.textContent = formatARS(totals.activeTotal);
      }

      function renderCart() {
        const totals = computeTotals();
        const unitMode = getUnitModeForDisplay();
        const itemsLabel = totals.totalUnits === 1 ? '1 ítem' : `${totals.totalUnits} ítems`;

        els.cartCountBadge.textContent = itemsLabel;
        els.clearCartBtn.style.display = cart.length > 0 ? 'inline-flex' : 'none';

                <circle cx="12" cy="12" r="9"/>
                <circle cx="12" cy="12" r="3"/>

              ? `<input type="number" class="qty-inline-input tabular" id="qty-edit-input" min="1" step="1" inputmode="numeric" value="${item.qty}">`
              : `<button type="button" class="qty-inline-btn tabular" data-edit-qty="${esc(item.key)}" title="Tocar para escribir cantidad">${item.qty}</button>`;

            const unitMetaText = isMixedProp
              ? `Ef: ${formatARS(info.cash)} · Tr: ${formatARS(info.transfer)}`
              : `${formatARS(unitPrice)} c/u`;

            return `
              <div class="cart-item">
                <div class="cart-item-main">
                  <div class="cart-item-info">
                    <div class="cart-item-name">${esc(info.name)}</div>
                    <div class="cart-item-meta">
                      <span class="tabular">${unitMetaText}</span>
                      ${isManual ? '<span class="tag-pill">Rápido</span>' : ''}
                    </div>
                  </div>
                  <div class="cart-item-controls">
                    <div class="card-stepper">
                      <button type="button" class="qty-btn" data-cart-dec="${esc(item.key)}" aria-label="Restar 1 ${esc(info.name)}">−</button>
                      ${qtyControl}
                      <button type="button" class="qty-btn" data-cart-inc="${esc(item.key)}" aria-label="Sumar 1 ${esc(info.name)}">+</button>
                    </div>
                    <div class="cart-subtotal tabular">${isMixedProp ? `${formatARS(roundMoney(info.cash * item.qty))}` : formatARS(lineTotal)}</div>
                    <button type="button" class="qty-btn" style="width:26px;height:26px;color:var(--text-muted);" data-cart-remove="${esc(item.key)}" aria-label="Quitar ${esc(info.name)}">×</button>
                  </div>
                </div>
                <div class="cart-item-subrow">
                  <button type="button" class="color-pill-btn ${colorText ? '' : 'empty'}" data-open-variant="${esc(item.key)}">
                    ${colorText ? `${renderColorDot(colorText)} <span>${esc(colorText)}</span>` : '<span>+ Color / nombre</span>'}
                  </button>
                  ${item.productId ? `<button type="button" class="split-color-link" data-add-color-prod="${esc(item.productId)}">+ Otro color</button>` : ''}
                </div>
              </div>
            `;
          }).join('');

          els.cartItemsList.innerHTML = itemsHtml + `
            <button type="button" class="quick-item-trigger" id="quick-item-btn">
              + Ingresar otro producto (solo en esta cuenta)
            </button>
          `;
        }

        const qEmpty = document.getElementById('quick-item-empty-btn');
        const qList = document.getElementById('quick-item-btn');
        [qEmpty, qList].forEach((btn) => {
          if (btn) {
            btn.addEventListener('click', () => openProductModal({ saveToCatalog: false, addToCart: true }));
          }
        });

        if (editingQtyKey) {
          const inp = document.getElementById('qty-edit-input');
          if (inp) {
            inp.focus();
            inp.select();
            const commit = () => setCartItemQty(editingQtyKey, inp.value);
            inp.addEventListener('blur', commit, { once: true });
            inp.addEventListener('keydown', (e) => {
              if (e.key === 'Enter') {
                e.preventDefault();
                inp.blur();
              } else if (e.key === 'Escape') {
                editingQtyKey = null;
                renderCart();
              }
            });
          }
        }

        renderCartSummaryFooter(totals);
      }

      function getFilteredSales() {
        const now = new Date();
        const q = salesSearchQuery.trim().toLowerCase();

        return sales.filter((sale) => {
          if (salesFilter === 'today' && !sameLocalDay(sale.createdAt, now)) {
            return false;
          }
          if (!q) return true;
          const haystack = [
            `#${sale.number}`,
            sale.note || '',
            sale.paymentMode,
            ...sale.items.map((i) => `${i.name} ${i.color || ''}`)
          ].join(' ').toLowerCase();
          return haystack.includes(q);
        });
      }

      function renderSalesView() {
        document.querySelectorAll('[data-sales-filter]').forEach((btn) => {
          btn.classList.toggle('active', btn.dataset.salesFilter === salesFilter);
        });

        const list = getFilteredSales();
        let sumCash = 0;
        let sumTransfer = 0;
        let sumUnits = 0;
        let cashCobros = 0;
        let transferCobros = 0;

        for (const s of list) {
          const sCash = typeof s.cashAmount === 'number' ? s.cashAmount : (s.paymentMode === 'efectivo' ? s.totalAmount : 0);
          const sTransfer = typeof s.transferAmount === 'number' ? s.transferAmount : (s.paymentMode === 'transferencia' ? s.totalAmount : 0);
          sumCash += sCash;
          sumTransfer += sTransfer;
          if (sCash > 0) cashCobros += 1;
          if (sTransfer > 0) transferCobros += 1;
          sumUnits += s.items.reduce((acc, i) => acc + i.qty, 0);
        }

        sumCash = roundMoney(sumCash);
        sumTransfer = roundMoney(sumTransfer);
        const grandTotal = roundMoney(sumCash + sumTransfer);
        const periodLabel = salesFilter === 'today' ? 'Hoy' : 'Total acumulado';

        els.salesKpis.innerHTML = `
          <div class="kpi-card kpi-card-total">
            <div class="kpi-label">Vendido (${periodLabel})</div>
            <div class="kpi-val tabular">${formatARS(grandTotal)}</div>
            <div class="kpi-sub tabular">${list.length} ${list.length === 1 ? 'venta' : 'ventas'} · ${sumUnits} ${sumUnits === 1 ? 'unidad' : 'unidades'}</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Efectivo</div>
            <div class="kpi-val tabular is-cash">${formatARS(sumCash)}</div>
            <div class="kpi-sub">${cashCobros} ${cashCobros === 1 ? 'cobro' : 'cobros'}</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Transferencia</div>
            <div class="kpi-val tabular is-transfer">${formatARS(sumTransfer)}</div>
            <div class="kpi-sub">${transferCobros} ${transferCobros === 1 ? 'cobro' : 'cobros'}</div>
          </div>
        `;

        els.shareDaySummaryBtn.disabled = list.length === 0;
        els.clearSalesBtn.style.display = sales.length > 0 ? 'inline-flex' : 'none';

        if (list.length === 0) {
          els.salesList.innerHTML = `
            <div class="empty-catalog">
              <div style="font-weight:600;color:var(--text);margin-bottom:4px;">Sin ventas cerradas${salesFilter === 'today' ? ' hoy' : ''}</div>
              <div style="font-size:0.84rem;">Cuando cierres una cuenta en Caja con "Cerrar venta", aparecerá aquí para compartir o revisar.</div>
            </div>
          `;
          return;
        }

        els.salesList.innerHTML = list.map((sale) => {
          const isMixed = sale.paymentMode === 'mixto';
          const isCash = sale.paymentMode === 'efectivo';
          const badgeClass = isMixed ? 'mixed' : (isCash ? 'cash' : 'transfer');
          const badgeText = isMixed ? `Mixto · ${getMixedRuleLabel(sale.mixedPriceRule)}` : (isCash ? 'Efectivo' : 'Transferencia');
          const totalColor = isMixed ? 'var(--mixed)' : (isCash ? 'var(--cash)' : 'var(--transfer)');

          const sCash = typeof sale.cashAmount === 'number' ? sale.cashAmount : (isCash ? sale.totalAmount : 0);
          const sTransfer = typeof sale.transferAmount === 'number' ? sale.transferAmount : (sale.paymentMode === 'transferencia' ? sale.totalAmount : 0);

          const itemsLis = sale.items.map((item) => `
            <li class="sale-items-li">
              <div class="sale-item-desc">
                <strong class="tabular">${item.qty}×</strong>
                <span>${esc(item.name)}</span>
                ${item.color ? `<span class="color-pill-btn" style="cursor:default;padding:2px 8px;">${renderColorDot(item.color)} ${esc(item.color)}</span>` : ''}
              </div>
              <span class="tabular" style="font-weight:600;">${isMixed && sale.mixedPriceRule === 'proporcional' && typeof item.cash === 'number' ? `${formatARS(roundMoney(item.cash * item.qty))}` : formatARS(item.subtotal)}</span>
            </li>
          `).join('');

          const splitSummary = isMixed
            ? `<div class="sale-note-line tabular">Efectivo: <strong style="color:var(--cash)">${formatARS(sCash)}</strong> · Transf.: <strong style="color:var(--transfer)">${formatARS(sTransfer)}</strong>${sale.cashReceived !== null && sale.changeAmount !== null ? ` · Pagó ${formatARS(sale.cashReceived)} (Vuelto ${formatARS(sale.changeAmount)})` : ''}</div>`
            : (isCash && sale.cashReceived !== null && sale.changeAmount !== null
                ? `<div class="sale-note-line tabular">Pagó con ${formatARS(sale.cashReceived)} · Vuelto ${formatARS(sale.changeAmount)}</div>`
                : '');

          return `
            <article class="sale-card" data-sale-id="${esc(sale.id)}">
              <div class="sale-card-top">
                <div class="sale-meta">
                  <span class="sale-num tabular">Venta #${sale.number}</span>
                  <span class="sale-date">${esc(formatSaleDate(sale.createdAt))}</span>
                  <span class="pay-badge ${badgeClass}">${esc(badgeText)}</span>
                </div>
                <div class="sale-total tabular" style="color:${totalColor};">${formatARS(sale.totalAmount)}</div>
              </div>

              <ul class="sale-items-ul">${itemsLis}</ul>
              ${splitSummary}

              <div class="sale-card-actions">
                ${sale.note ? `<div class="sale-note-line">Nota: <strong>${esc(sale.note)}</strong></div>` : '<span></span>'}
                <div class="sale-card-btns">
                  <button type="button" class="btn btn-sm" data-copy-sale="${esc(sale.id)}">Copiar</button>
                  <button type="button" class="btn btn-sm btn-primary" data-share-sale="${esc(sale.id)}">Compartir</button>
                  <button type="button" class="btn btn-sm btn-danger-ghost" data-delete-sale="${esc(sale.id)}" aria-label="Eliminar venta #${sale.number}">Eliminar</button>
                </div>
              </div>
            </article>
          `;
        }).join('');
      }

      function updateChangeDisplay(totalCash) {
        const raw = cashReceived.trim();
        if (!raw) {
          els.changeResult.textContent = 'Vuelto: —';
          els.changeResult.className = 'change-result tabular';
          return;
        }
        const paid = Number(raw);
        if (!Number.isFinite(paid) || paid < 0) {
          els.changeResult.textContent = 'Vuelto: —';
          els.changeResult.className = 'change-result tabular';
          return;
        }
        const diff = Math.round((paid - totalCash) * 100) / 100;
        if (diff >= 0) {
          els.changeResult.textContent = diff === 0 ? 'Pago justo' : `Vuelto: ${formatARS(diff)}`;
          els.changeResult.className = 'change-result tabular ok';
        } else {
          els.changeResult.textContent = `Falta: ${formatARS(Math.abs(diff))}`;
          els.changeResult.className = 'change-result tabular short';
        }
      }

      function renderTotalsOnly() {
        renderCart();
      }

      function renderAll() {
        renderHeaderAndTabs();
        renderPaymentSwitches();
        renderCatalog();
        renderCart();
        renderSalesView();
      }

      // ===== SHEET & PRODUCT MODAL =====
      function openSheet() {
        els.cartPanel.classList.add('open');
        els.cartBackdrop.classList.add('open');
        els.cartBackdrop.setAttribute('aria-hidden', 'false');
        syncBodyScrollLock();
      }

      function closeSheet() {
        els.cartPanel.classList.remove('open');
        els.cartBackdrop.classList.remove('open');
        els.cartBackdrop.setAttribute('aria-hidden', 'true');
        syncBodyScrollLock();
      }

      function syncModalCheckboxes() {
        els.prodAddCartRow.style.display = els.prodSaveCatalog.checked ? 'flex' : 'none';
      }

      function openProductModal({ prefillName = '', saveToCatalog = true, addToCart = true } = {}) {
        els.modalTitle.textContent = saveToCatalog ? 'Agregar producto' : 'Ingresar ítem rápido';
        els.prodName.value = prefillName;
        els.prodColor.value = '';
        els.prodCash.value = '';
        els.prodTransfer.value = '';
        els.prodCategory.value = saveToCatalog ? 'Filamento' : 'Otro';
        els.prodSaveCatalog.checked = saveToCatalog;
        els.prodAddToCart.checked = addToCart;
        syncModalCheckboxes();
        els.modal.classList.add('open');
        syncBodyScrollLock();
        setTimeout(() => els.prodName.focus(), 40);
      }

      function closeProductModal() {
        els.modal.classList.remove('open');
        syncBodyScrollLock();
      }

      function setEditMode(enabled) {
        isEditMode = enabled;
        els.toggleEditBtn.setAttribute('aria-pressed', enabled ? 'true' : 'false');
        els.toggleEditBtn.classList.toggle('btn-edit-active', enabled);
        els.toggleEditLabel.innerHTML = enabled
          ? 'Listo'
          : '<span class="hide-xs">Editar precios</span><span class="only-xs">Precios</span>';
        els.editBanner.classList.toggle('visible', enabled);
        renderCatalog();
      }

      // ===== EVENT LISTENERS =====
      document.querySelectorAll('[data-view-tab]').forEach((btn) => {
        btn.addEventListener('click', () => {
          currentView = btn.dataset.viewTab;
          if (currentView !== 'caja') {
            closeSheet();
            if (isEditMode) setEditMode(false);
          }
          renderAll();
        });
      });

      document.querySelectorAll('.payment-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const mode = btn.dataset.payMode;
          if (mode === paymentMode) return;
          paymentMode = mode;
          safeStorageSet(STORAGE_PAY_MODE, mode);
          renderAll();
          pulseTotals();
        });
      });

      els.altTotalBtn.addEventListener('click', () => {
        paymentMode = paymentMode === 'efectivo' ? 'transferencia' : 'efectivo';
        safeStorageSet(STORAGE_PAY_MODE, paymentMode);
        renderAll();
        pulseTotals();
      });

      els.searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value;
        els.searchClearBtn.classList.toggle('visible', searchQuery.length > 0);
        renderCatalog();
      });

      els.searchClearBtn.addEventListener('click', () => {
        searchQuery = '';
        els.searchInput.value = '';
        els.searchClearBtn.classList.remove('visible');
        renderCatalog();
        els.searchInput.focus();
      });

      els.toggleEditBtn.addEventListener('click', () => setEditMode(!isEditMode));
      els.doneEditBtn.addEventListener('click', () => setEditMode(false));

      els.resetCatalogBtn.addEventListener('click', () => {
        const prev = products.map((p) => ({ ...p }));
        products = DEFAULT_PRODUCTS.map((p) => ({ ...p }));
        saveProducts();
        renderAll();
        showToast('Lista restaurada a precios iniciales', 'Deshacer', () => {
          products = prev;
          saveProducts();
          renderAll();
        });
      });

      // Catalog Grid delegation
      els.productGrid.addEventListener('click', (e) => {
        const openVarBtn = e.target.closest('[data-open-variant]');
        if (openVarBtn && !isEditMode) {
          openVariantModal(openVarBtn.dataset.openVariant);
          return;
        }

        const addColorBtn = e.target.closest('[data-add-color-prod]');
        if (addColorBtn && !isEditMode) {
          const key = addProductToCart(addColorBtn.dataset.addColorProd, { forceNewLine: true });
          if (key) openVariantModal(key);
          return;
        }

        const addBtn = e.target.closest('[data-add-product]');
        if (addBtn && !isEditMode) {
          addProductToCart(addBtn.dataset.addProduct);
          return;
        }

        const incBtn = e.target.closest('[data-prod-inc]');
        if (incBtn) {
          adjustProductSingleLineQty(incBtn.dataset.prodInc, 1);
          return;
        }

        const decBtn = e.target.closest('[data-prod-dec]');
        if (decBtn) {
          adjustProductSingleLineQty(decBtn.dataset.prodDec, -1);
          return;
        }

        const delBtn = e.target.closest('[data-delete-prod]');
        if (delBtn) {
          const id = delBtn.dataset.deleteProd;
          const idx = products.findIndex((p) => p.id === id);
          if (idx === -1) return;
          const removed = products[idx];
          products.splice(idx, 1);
          saveProducts();
          renderAll();
          showToast(`"${removed.name}" eliminado`, 'Deshacer', () => {
            products.splice(idx, 0, removed);
            saveProducts();
            renderAll();
          });
          return;
        }

        const plus5Btn = e.target.closest('[data-plus5-id]');
        if (plus5Btn) {
          const id = plus5Btn.dataset.plus5Id;
          const prod = products.find((p) => p.id === id);
          if (!prod) return;
          prod.transfer = Math.round(prod.cash * 1.05);
          saveProducts();
          const card = plus5Btn.closest('[data-edit-id]');
          const tfInput = card ? card.querySelector('[data-field="transfer"]') : null;
          if (tfInput) tfInput.value = prod.transfer;
          renderTotalsOnly();
          showToast(`Transferencia +5%: ${formatARS(prod.transfer)}`);
          return;
        }

        const catBtn = e.target.closest('[data-toggle-cat]');
        if (catBtn) {
          const id = catBtn.dataset.toggleCat;
          const prod = products.find((p) => p.id === id);
          if (!prod) return;
          prod.category = prod.category === 'Otro' ? 'Filamento' : 'Otro';
          saveProducts();
          catBtn.textContent = prod.category;
        }
      });

      els.productGrid.addEventListener('input', (e) => {
        if (!isEditMode) return;
        const card = e.target.closest('[data-edit-id]');
        if (!card) return;
        const prod = products.find((p) => p.id === card.dataset.editId);
        if (!prod) return;

        const field = e.target.dataset.field;
        if (field === 'name') {
          prod.name = e.target.value.trim() || 'Producto sin nombre';
          saveProducts();
          renderTotalsOnly();
        } else if (field === 'cash') {
          prod.cash = normalizeNumber(e.target.value);
          saveProducts();
          renderTotalsOnly();
        } else if (field === 'transfer') {
          prod.transfer = normalizeNumber(e.target.value);
          saveProducts();
          renderTotalsOnly();
        }
      });

      els.productGrid.addEventListener('focusout', (e) => {
        if (!isEditMode) return;
        if (e.target.dataset.field === 'name' && !e.target.value.trim()) {
          e.target.value = 'Producto sin nombre';
        }
      });

      // Cart items delegation
      els.cartItemsList.addEventListener('click', (e) => {
        const openVarBtn = e.target.closest('[data-open-variant]');
        if (openVarBtn) {
          openVariantModal(openVarBtn.dataset.openVariant);
          return;
        }

        const addColorBtn = e.target.closest('[data-add-color-prod]');
        if (addColorBtn) {
          const key = addProductToCart(addColorBtn.dataset.addColorProd, { forceNewLine: true });
          if (key) openVariantModal(key);
          return;
        }

        const incBtn = e.target.closest('[data-cart-inc]');
        if (incBtn) {
          adjustCartItemQty(incBtn.dataset.cartInc, 1);
          return;
        }

        const decBtn = e.target.closest('[data-cart-dec]');
        if (decBtn) {
          adjustCartItemQty(decBtn.dataset.cartDec, -1);
          return;
        }

        const remBtn = e.target.closest('[data-cart-remove]');
        if (remBtn) {
          setCartItemQty(remBtn.dataset.cartRemove, 0);
          return;
        }

        const editQtyBtn = e.target.closest('[data-edit-qty]');
        if (editQtyBtn) {
          editingQtyKey = editQtyBtn.dataset.editQty;
          renderCart();
        }
      });

      els.cashReceivedInput.addEventListener('input', (e) => {
        cashReceived = e.target.value;
        const totals = computeTotals();
        const dueCash = paymentMode === 'mixto' ? totals.mixed.cashPart : totals.totalCash;
        updateChangeDisplay(dueCash);
      });

      document.querySelectorAll('[data-mixed-rule]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const rule = btn.dataset.mixedRule;
          if (rule === mixedPriceRule) return;
          mixedPriceRule = rule;
          safeStorageSet(STORAGE_MIXED_RULE, rule);
          renderAll();
          pulseTotals();
        });
      });

      els.mixedCashInput.addEventListener('input', (e) => {
        mixedAnchor = 'cash';
        mixedRawInput = e.target.value;
        renderCartSummaryFooter(computeTotals());
      });

      els.mixedTransferInput.addEventListener('input', (e) => {
        mixedAnchor = 'transfer';
        mixedRawInput = e.target.value;
        renderCartSummaryFooter(computeTotals());
      });

      els.saleNoteInput.addEventListener('input', (e) => {
        saleNote = e.target.value;
      });

      els.clearCartBtn.addEventListener('click', () => clearCart(true));
      els.closeSaleBtn.addEventListener('click', closeCurrentSale);
      els.shareCartBtn.addEventListener('click', () => {
        if (cart.length === 0) return;
        openShareModal('Compartir cuenta', buildCurrentCartShareText());
      });

      // Mobile sheet open/close
      els.mobileBar.addEventListener('click', openSheet);
      els.mobileBar.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          openSheet();
        }
      });
      els.closeSheetBtn.addEventListener('click', closeSheet);
      els.cartBackdrop.addEventListener('click', closeSheet);

      // Variant / Color modal listeners
      els.closeVariantBtn.addEventListener('click', () => closeVariantModal(true));
      els.variantSaveBtn.addEventListener('click', () => closeVariantModal(true));
      els.variantModal.addEventListener('click', (e) => {
        if (e.target === els.variantModal) closeVariantModal(true);
      });

      els.variantQtyDec.addEventListener('click', () => {
        variantDraftQty = Math.max(1, (Math.floor(Number(els.variantQtyInput.value)) || 1) - 1);
        els.variantQtyInput.value = String(variantDraftQty);
      });

      els.variantQtyInc.addEventListener('click', () => {
        variantDraftQty = Math.max(1, (Math.floor(Number(els.variantQtyInput.value)) || 1) + 1);
        els.variantQtyInput.value = String(variantDraftQty);
      });

      document.getElementById('variant-quick-qty').addEventListener('click', (e) => {
        const btn = e.target.closest('[data-set-qty]');
        if (!btn) return;
        variantDraftQty = Number(btn.dataset.setQty) || 1;
        els.variantQtyInput.value = String(variantDraftQty);
      });

      els.colorPresetsGrid.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-preset-color]');
        if (!btn) return;
        variantDraftColor = btn.dataset.presetColor;
        els.variantColorInput.value = variantDraftColor;
        renderColorPresets();
      });

      els.variantColorInput.addEventListener('input', (e) => {
        variantDraftColor = e.target.value;
        renderColorPresets();
      });

      els.variantColorInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          closeVariantModal(true);
        }
      });

      els.variantRemoveBtn.addEventListener('click', () => {
        if (!editingVariantKey) return;
        const keyToDelete = editingVariantKey;
        editingVariantKey = null;
        els.variantModal.classList.remove('open');
        syncBodyScrollLock();
        setCartItemQty(keyToDelete, 0);
      });

      els.variantAddAnotherBtn.addEventListener('click', () => {
        const committed = commitVariantDraft();
        if (!committed) return;
        let newKey = null;
        if (committed.productId) {
          newKey = addProductToCart(committed.productId, { forceNewLine: true });
        } else {
          newKey = addAdhocItemToCart(committed.name, committed.cash, committed.transfer, '');
        }
        if (newKey) {
          openVariantModal(newKey);
        }
      });

      // Product modal
      els.openAddProductBtn.addEventListener('click', () => {
        openProductModal({ saveToCatalog: true, addToCart: !isEditMode });
      });
      els.closeModalBtn.addEventListener('click', closeProductModal);
      els.cancelModalBtn.addEventListener('click', closeProductModal);
      els.modal.addEventListener('click', (e) => {
        if (e.target === els.modal) closeProductModal();
      });
      els.prodSaveCatalog.addEventListener('change', syncModalCheckboxes);

      els.modalPlus5Btn.addEventListener('click', () => {
        const cashVal = normalizeNumber(els.prodCash.value);
        if (cashVal > 0) {
          els.prodTransfer.value = Math.round(cashVal * 1.05);
        }
      });

      els.productForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const name = els.prodName.value.trim();
        const color = els.prodColor.value.trim();
        const cash = normalizeNumber(els.prodCash.value);
        const transferRaw = els.prodTransfer.value.trim();
        const transfer = transferRaw === '' ? cash : normalizeNumber(transferRaw);
        const category = els.prodCategory.value || 'Otro';
        const saveToCat = els.prodSaveCatalog.checked;
        const addToBill = els.prodAddToCart.checked;

        if (!name) return;

        if (saveToCat) {
          const newProd = {
            id: uid('prod'),
            name,
            cash,
            transfer,
            category
          };
          products.push(newProd);
          saveProducts();
          if (addToBill) {
            addProductToCart(newProd.id, { forceNewLine: Boolean(color), color });
          } else {
            renderAll();
          }
          showToast(`"${name}" guardado en el catálogo`);
        } else {
          addAdhocItemToCart(name, cash, transfer, color);
          showToast(`"${name}" agregado a la cuenta`);
        }

        closeProductModal();
      });

      // Sales View listeners
      document.querySelectorAll('[data-sales-filter]').forEach((btn) => {
        btn.addEventListener('click', () => {
          salesFilter = btn.dataset.salesFilter;
          renderSalesView();
        });
      });

      els.salesSearchInput.addEventListener('input', (e) => {
        salesSearchQuery = e.target.value;
        renderSalesView();
      });

      els.shareDaySummaryBtn.addEventListener('click', () => {
        const list = getFilteredSales();
        if (list.length === 0) return;
        const title = salesFilter === 'today' ? 'Compartir cierre de hoy' : 'Compartir resumen de ventas';
        openShareModal(title, buildSalesSummaryShareText(list));
      });

      els.clearSalesBtn.addEventListener('click', () => {
        if (sales.length === 0) return;
        const snapshot = sales.map((s) => ({ ...s }));
        sales = [];
        saveSales();
        renderAll();
        showToast('Historial de ventas limpiado', 'Deshacer', () => {
          sales = snapshot;
          saveSales();
          renderAll();
        });
      });

      els.salesList.addEventListener('click', async (e) => {
        const copyBtn = e.target.closest('[data-copy-sale]');
        if (copyBtn) {
          const sale = sales.find((s) => s.id === copyBtn.dataset.copySale);
          if (!sale) return;
          const ok = await copyTextToClipboard(buildSaleShareText(sale));
          showToast(ok ? `Venta #${sale.number} copiada` : 'No se pudo copiar');
          return;
        }

        const shareBtn = e.target.closest('[data-share-sale]');
        if (shareBtn) {
          const sale = sales.find((s) => s.id === shareBtn.dataset.shareSale);
          if (!sale) return;
          openShareModal(`Compartir Venta #${sale.number}`, buildSaleShareText(sale));
          return;
        }

        const delBtn = e.target.closest('[data-delete-sale]');
        if (delBtn) {
          const idx = sales.findIndex((s) => s.id === delBtn.dataset.deleteSale);
          if (idx === -1) return;
          const removed = sales[idx];
          sales.splice(idx, 1);
          saveSales();
          renderAll();
          showToast(`Venta #${removed.number} eliminada`, 'Deshacer', () => {
            sales.splice(idx, 0, removed);
            saveSales();
            renderAll();
          });
        }
      });

      // Share Modal listeners
      els.closeShareBtn.addEventListener('click', closeShareModal);
      els.shareModal.addEventListener('click', (e) => {
        if (e.target === els.shareModal) closeShareModal();
      });

      els.shareWhatsappBtn.addEventListener('click', () => {
        const text = els.sharePreviewText.value;
        const url = `https://wa.me/?text=${encodeURIComponent(text)}`;
        window.open(url, '_blank', 'noopener,noreferrer');
      });

      els.shareNativeBtn.addEventListener('click', async () => {
        if (typeof navigator.share !== 'function') return;
        try {
          await navigator.share({
            title: currentShareTitle,
            text: els.sharePreviewText.value
          });
        } catch (err) {
          if (err && err.name !== 'AbortError') {
            const ok = await copyTextToClipboard(els.sharePreviewText.value);
            showToast(ok ? 'Texto copiado para compartir' : 'No se pudo compartir');
          }
        }
      });

      els.shareCopyBtn.addEventListener('click', async () => {
        const ok = await copyTextToClipboard(els.sharePreviewText.value);
        showToast(ok ? 'Texto copiado al portapapeles' : 'No se pudo copiar');
        if (ok) closeShareModal();
      });

      // Theme toggle
      els.themeToggleBtn.addEventListener('click', () => {
        const current = document.documentElement.getAttribute('data-theme') || 'light';
        applyTheme(current === 'dark' ? 'light' : 'dark');
      });

      // Global Escape key & resize scroll lock sync
      window.addEventListener('resize', syncBodyScrollLock);
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          if (els.shareModal.classList.contains('open')) {
            closeShareModal();
          } else if (els.variantModal.classList.contains('open')) {
            closeVariantModal(false);
          } else if (els.modal.classList.contains('open')) {
            closeProductModal();
          } else if (els.cartPanel.classList.contains('open')) {
            closeSheet();
          }
        }
      });

      if ('serviceWorker' in navigator && (location.protocol === 'http:' || location.protocol === 'https:')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(() => {});
        });
      }

      // ===== BOOT =====
      initTheme();
      renderAll();
    })();
  </script>
</body>
</html>
